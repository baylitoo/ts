[project]
name = "rl-money-laundering"
version = "0.1.0"
description = "Reinforcement Learning for Anti-Money Laundering Detection on Transaction Graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "gymnasium>=0.29.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "ray[rllib]>=2.40.0",  # RLlib for distributed RL training
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest-dotenv>=0.5.2",
    "pytest>=8.3.3",
    "ruff>=0.7.4",
]
docs = [
    "sphinx>=7.3,<8",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-autodoc-typehints>=1.25",
    "linkify-it-py>=2.0",
    "furo>=2024.8.6",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
]

[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]


[tool.mypy]
strict = true
explicit_package_bases = true
namespace_packages = true
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
exclude = ["^src/"]
